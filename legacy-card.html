<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俊宏</title>
<style>
	:root {
		--bg: #f0f0f3;
		--card: rgba(255,255,255,.72);
		--text: #1d1d1f;
		--secondary: #86868b;
		--link: #0066cc;
		--separator: #d2d2d7;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #0a0a0a;
			--card: rgba(28,28,30,.72);
			--text: #f5f5f7;
			--secondary: #98989d;
			--link: #2997ff;
			--separator: #38383a;
		}
	}
	* { margin: 0; padding: 0; box-sizing: border-box; }
	body {
		font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
		background: var(--bg);
		color: var(--text);
		display: flex; align-items: center; justify-content: center;
		min-height: 100vh; padding: 24px;
		-webkit-font-smoothing: antialiased;
	}
	body::before {
		content: '';
		position: fixed;
		inset: 0;
		background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0,102,204,.08), transparent);
		pointer-events: none;
	}
	.card {
		background: var(--card);
		backdrop-filter: blur(24px);
		-webkit-backdrop-filter: blur(24px);
		border-radius: 24px;
		padding: 48px 40px 40px;
		max-width: 360px; width: 100%;
		text-align: center;
		border: 1px solid var(--separator);
		animation: fadeIn .6s ease-out both;
	}
	@keyframes fadeIn {
		from { opacity: 0; transform: translateY(16px); }
		to { opacity: 1; transform: translateY(0); }
	}
	.avatar {
		width: 88px; height: 88px;
		border-radius: 50%;
		object-fit: cover;
		margin-bottom: 20px;
		box-shadow: 0 0 0 4px var(--card), 0 0 0 6px var(--separator);
	}
	h1 {
		font-size: 26px; font-weight: 600;
		letter-spacing: .04em;
		margin-bottom: 4px;
	}
	.tagline {
		font-size: 14px; color: var(--secondary);
		margin-bottom: 24px;
	}
	.divider {
		width: 32px; height: 1px; background: var(--separator);
		margin: 0 auto 24px;
	}
	.social-icons {
		display: flex; justify-content: center; gap: 16px;
	}
	.social-icon {
		display: flex; align-items: center; justify-content: center;
		width: 40px; height: 40px;
		border-radius: 50%;
		color: var(--secondary);
		text-decoration: none;
		transition: color .25s, background .25s, transform .25s;
		position: relative;
	}
	a.social-icon:hover {
		color: var(--link);
		background: rgba(0,102,204,.08);
		transform: translateY(-2px);
	}
	.has-tooltip {
		cursor: default;
		transition: color .25s, transform .25s;
	}
	.has-tooltip:hover {
		color: var(--link);
		transform: translateY(-2px);
	}
	.tooltip {
		position: absolute;
		bottom: calc(100% + 12px);
		left: 50%;
		transform: translateX(-50%);
		pointer-events: none;
		opacity: 0;
		transition: opacity .25s, transform .25s;
	}
	.tooltip img {
		display: block;
		width: 160px;
		height: 160px;
		border-radius: 12px;
		box-shadow: 0 8px 32px rgba(0,0,0,.18);
		background: #fff;
	}
	.has-tooltip:hover .tooltip {
		opacity: 1;
		transform: translateX(-50%) translateY(-4px);
	}
</style>
</head>
<body>
<div class="card">
	<img class="avatar" src="touxiang.jpg" alt="俊宏">
	<h1>俊宏</h1>
	<p class="tagline">Be water, my friend.</p>
	<div class="divider"></div>
	<div class="social-icons">

		</span>
	</div>
</div>
</body>
</html>
